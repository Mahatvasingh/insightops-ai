services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightops-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/insightops.db
      - SYNC_DATABASE_URL=sqlite:////app/data/insightops.db
      - SQLITE_CHECKPOINT_DB=/app/data/checkpointer.db
    volumes:
      - insightops-data:/app/data
    restart: unless-stopped
    networks:
      - insightops-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightops-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - insightops-net

volumes:
  insightops-data:

networks:
  insightops-net:
    driver: bridge
